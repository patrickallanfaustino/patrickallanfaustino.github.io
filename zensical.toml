[project]
site_url = "https://patrickallanfaustino.github.io/"
site_name = "Documentação sobre Química Biofísica Computacional"
site_description = "Workflows de simulação de biomoléculas"
site_author = "Patrick Allan dos Santos Faustino"
copyright = "CC BY 4.0 — Patrick Faustino"

repo_url = "https://github.com/patrickallanfaustino/patrickallanfaustino.github.io"
repo_name = "GitHub"
edit_uri = "edit/main/docs"

nav = [
  { "Início" = "index.md" },
  { "Instalação" = [
    { "GROMACS + CUDA" = "instalacao/cuda-gromacs.md" },
    { "GROMACS + ROCm" = "instalacao/rocm-acpp-gromacs.md" },
    { "gridUNESP" = "instalacao/gridunesp.md" },
  ] },
  { "Dinâmica molecular" = [
    { "DM básica" = "dinamica/md-easy.md" },
    { "Análise de resultados" = "dinamica/md-analysis.md" },
    { "Imagens e vídeos" = "dinamica/md-visual.md" },
  ] },
  { "Tese" = [
    { "Pipeline de moléculas e ajustes" = "tese/pipeline-moleculas.md" },
  ] },
  { "Sobre" = "sobre.md" },
]

# extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "pt-BR"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/orcid"
link = "https://orcid.org/0000-0002-9323-2489"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/patrickallanfaustino"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/pkfaustino"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/pckfaustino"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
